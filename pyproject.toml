[project]
name = "allianz-dbt-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Victor Staack", email = "victor.staack@proton.me" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "dbt-postgres>=1.6.0",
    "psycopg2-binary>=2.9.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.0.0,<2.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "graphviz>=0.20.0",
    "duckdb>=1.4.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
allianz-dbt-assignment = "allianz_dbt_assignment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
