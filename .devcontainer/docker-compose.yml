version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=dbt_user
      - POSTGRES_PASSWORD=dbt_password
      - POSTGRES_DB=dbt_dev
    depends_on:
      - postgres
    networks:
      - dbt-network

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=dbt_user
      - POSTGRES_PASSWORD=dbt_password
      - POSTGRES_DB=dbt_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dbt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d dbt_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  dbt-network:
    driver: bridge
